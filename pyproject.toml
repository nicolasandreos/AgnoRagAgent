[project]
name = "agnoasimov"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicolas", email = "nicolasandreose@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agno[openai,os]>=2.9.0",
    "chonkie[semantic]>=1.7.0",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.27",
    "yfinance>=1.6.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[project.scripts]
agnoasimov = "agnoasimov:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
